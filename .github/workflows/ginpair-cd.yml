name: ginpair-cd

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Run ArrangeStep
        run: .\build.cmd ArrangeStep

      - name: Run ConstructStep
        run: .\build.cmd ConstructStep --skip ArrangeStep

      - name: Run ExamineStep
        run: .\build.cmd ExamineStep --skip ArrangeStep ConstructStep MutationAnalysis

      - name: Run PublishStep
        run: .\build.cmd PublishStep --skip ArrangeStep ConstructStep ExamineStep 

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ginpairhosted-hzeebcare5hve5ek'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish'