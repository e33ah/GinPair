name: ginpair-cd

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: windows-latest
    env:
      AzureResourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AzureWebAppName: ${{ secrets.AZURE_WEB_APP_NAME }}
    steps:
      - uses: actions/checkout@v7
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Run ArrangeStep
        run: .\build.cmd ArrangeStep

      - name: Run ConstructStep
        run: .\build.cmd ConstructStep --skip ArrangeStep

      - name: Run ExamineStep
        run: .\build.cmd ExamineStep --skip ArrangeStep ConstructStep

      - name: Run PublishStep
        run: .\build.cmd PublishStep --skip ArrangeStep ConstructStep ExamineStep 

      - name: Run ReleaseStep
        run: .\build.cmd ReleaseStep --skip ArrangeStep ConstructStep ExamineStep PublishStep