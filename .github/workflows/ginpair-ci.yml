name: ginpair-ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    name: ginpair-ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: ArrangeStep'
        run: dotnet fallout ArrangeStep
      - name: 'Run: ConstructStep'
        run: dotnet fallout ConstructStep --skip ArrangeStep
      - name: 'Run: ExamineStep'
        run: dotnet fallout ExamineStep --skip ArrangeStep ConstructStep
